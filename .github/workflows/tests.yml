name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run inspector tests
        working-directory: website-security-lab/framework
        run: python -B -m unittest discover -s tests

      - name: Run range tests
        working-directory: website-security-lab
        run: python -B -m unittest discover -s range/tests

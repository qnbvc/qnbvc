<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930"
     font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1200" height="930" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="24" font-weight="bold" fill="#0F172A">网站安全智能巡检智能体 · 总体架构</text>
  <text x="40" y="70" font-size="13" fill="#64748B">
    在授权范围内：资产发现 → 智能规划与工具编排 → 三类检测 → 去重/验证/分级 → 证据·影响·修复建议 → 告警/基线/复测/报告 的闭环
  </text>

  <!-- ===== 板块1 接入与授权闸门 ===== -->
  <rect x="40" y="84" width="1120" height="108" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="64" y="112" font-size="16" font-weight="bold" fill="#1D4ED8">板块① 接入与授权闸门层（合规地基）</text>
  <rect x="64" y="126" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="166.4" y="148" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">入口与触发</text>
  <text x="166.4" y="166" font-size="11.5" fill="#475569" text-anchor="middle">Web 控制台 / API / 定时器</text>
  <rect x="280.8" y="126" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="383.2" y="148" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">授权与范围</text>
  <text x="383.2" y="166" font-size="11.5" fill="#475569" text-anchor="middle">域名·IP段·URL前缀 / 有效期</text>
  <rect x="497.6" y="126" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="600" y="148" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">巡检策略</text>
  <text x="600" y="166" font-size="11.5" fill="#475569" text-anchor="middle">周期·时间窗·深度·并发</text>
  <rect x="714.4" y="126" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="816.8" y="148" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">敏感信息定义</text>
  <text x="816.8" y="166" font-size="11.5" fill="#475569" text-anchor="middle">关键词/正则/文件类型/样例</text>
  <rect x="931.2" y="126" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="1033.6" y="148" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">合规闸门</text>
  <text x="1033.6" y="166" font-size="11.5" fill="#475569" text-anchor="middle">scope校验·限速·UA·审计</text>

  <polygon points="600,193 597,203 603,203" fill="#94A3B8"/>


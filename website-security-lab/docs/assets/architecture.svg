  <text x="909.71" y="428" font-size="10.5" fill="#475569" text-anchor="middle">影响·修复建议</text>
  <rect x="993.14" y="362" width="142.86" height="74" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="1064.57" y="394" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Memory</text>

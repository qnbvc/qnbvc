  <text x="600" y="268" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">页面爬取</text>
  <text x="600" y="286" font-size="11.5" fill="#475569" text-anchor="middle">HTML/sitemap/JS接口提取</text>
  <rect x="714.4" y="246" width="204.8" height="52" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>

  <!-- 反哺闭环 -->
  <path d="M 26 720 L 26 288" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="18" y="504" font-size="11.5" fill="#64748B" text-anchor="middle"
        transform="rotate(-90 18 504)">基线 / 复测结果反哺：调整巡检策略与规则</text>

  <text x="40" y="908" font-size="11.5" fill="#64748B">
    统一 Finding 数据模型贯穿各层：板块③ 负责决策与解释，板块④ 负责执行，板块① 负责合规拦截；板块⑤ 产出可跟踪的闭环。
  </text>

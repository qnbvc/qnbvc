  <text x="64" y="492" font-size="16" font-weight="bold" fill="#C2410C">板块④ 检测能力层（可插拔开源工具适配器）</text>
  <rect x="64" y="502" width="349.33" height="122" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="80" y="526" font-size="14" font-weight="bold" fill="#9A3412">漏洞与弱配置</text>
  <text x="80" y="550" font-size="12" fill="#475569">· 组件版本 / CVE 指纹比对</text>
  <text x="80" y="574" font-size="12" fill="#475569">· 模板化 POC（nuclei 类）</text>
  <text x="80" y="598" font-size="12" fill="#475569">· 安全头 / CORS / 目录列表</text>
  <text x="80" y="620" font-size="12" fill="#475569">· 暴露面：.git / 备份 / 调试端点</text>
  <rect x="425.33" y="502" width="349.33" height="122" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="441.33" y="526" font-size="14" font-weight="bold" fill="#9A3412">页面篡改与挂马</text>
  <text x="441.33" y="550" font-size="12" fill="#475569">· 内容哈希 + DOM 结构基线 diff</text>
  <text x="441.33" y="574" font-size="12" fill="#475569">· 视觉截图比对（感知哈希）</text>
  <text x="441.33" y="598" font-size="12" fill="#475569">· 恶意外链白名单 + 域名信誉</text>
  <text x="441.33" y="620" font-size="12" fill="#475569">· 混淆脚本 / 暗链 / YARA 特征</text>
  <rect x="786.67" y="502" width="349.33" height="122" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="802.67" y="526" font-size="14" font-weight="bold" fill="#9A3412">敏感信息防泄露</text>
  <text x="802.67" y="550" font-size="12" fill="#475569">· 关键词 / 正则 / 文件类型 / 样例</text>
  <text x="802.67" y="574" font-size="12" fill="#475569">· 凭据密钥：AK-SK / Token / 连接串</text>
  <text x="802.67" y="598" font-size="12" fill="#475569">· 个人信息 PII + 校验降误报</text>
  <text x="802.67" y="620" font-size="12" fill="#475569">· 泄露面：.git / 备份 / 源码 / 元数据</text>

  <polygon points="600,641 597,651 603,651" fill="#94A3B8"/>


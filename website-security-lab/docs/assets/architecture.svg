  <rect x="528.57" y="362" width="142.86" height="74" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="600" y="394" font-size="12.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Fuser</text>

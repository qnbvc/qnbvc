  <text x="1064.57" y="428" font-size="10.5" fill="#475569" text-anchor="middle">基线·误报·指纹</text>

  <polygon points="600,453 597,463 603,463" fill="#94A3B8"/>

  <!-- ===== 板块4 检测能力层 ===== -->
